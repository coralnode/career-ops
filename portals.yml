# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    - "Sustainability"
    - "Data"
    - "Technology"
    - "Climate"
    - "Digital Transformation"
    - "Business technology"
    - "Data and AI"
    - "Sustainability Data and Technology"
    - "Co-founder"
    - "Partner"
    - "Professional services"
    - "technology adoption"
    - "Strategic pursuits"
    - "Solutions Architect"
    - "Product Manager"
    - "Business Systems"
    - "Transformation"
  negative:
    - "Junior"
    - "Intern"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "Engineer"
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    - "Vice President"
    - "VP"
    - "Senior Director"
    - "Managing Director"
    - "Head"
    - "Director"
    - "Co-founder"
    - "CTO"

# -- Search queries --
search_queries:
  - name: Greenhouse — SA & FDE
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Solutions Architect"'
    enabled: true

